<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mesura · video promocional</title>
<!--
  Fuente animada del video de Mesura (24 s). Se abre en el navegador y se reproduce en bucle.
  ?f=v vertical 1080×1920 · ?f=h horizontal 1920×1080 · ?f=og imagen social 1200×630 · &t=12 congela un segundo.
  marketing/render-promo.cjs lo renderiza cuadro a cuadro llamando a window.seek(t).
  Historia: la cinta se cierra sobre la cintura y, semana a semana, aprieta más mientras la báscula baja;
  la cinta se convierte en la línea de tendencia y aparece la app real; cierra el logo.
  Todos los números son inventados.
-->
<style>
@font-face { font-family: 'Archivo'; src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
:root { --bg: #0d1426; --tiza: #eceef1; --azul: #9cbde8; --cobalto: #3d6ab0; --dim: #a8abb2; --verde: #9cc79a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #070b16; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; color: var(--tiza); font-family: 'Archivo', system-ui, sans-serif;
  background: radial-gradient(120% 80% at 50% 30%, #1c2a4f 0%, #111a33 45%, #070b16 100%); }
.capa { position: absolute; inset: 0; }
.titulo { position: absolute; font-stretch: 78%; font-weight: 780; letter-spacing: -0.01em; line-height: 1.02; text-wrap: balance; }
.sub { position: absolute; color: var(--dim); font-weight: 500; line-height: 1.3; }
.num { font-variant-numeric: tabular-nums; font-stretch: 70%; font-weight: 760; }
#logo svg { position: absolute; overflow: visible; }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(156,189,232,.55), transparent 60%); opacity: 0; }
#lectura { position: absolute; text-align: center; }
#lectura .kg { color: var(--tiza); }
#lectura .kg small { font-size: .38em; color: var(--dim); font-weight: 600; margin-left: .15em; }
#lectura .sem { color: var(--azul); font-weight: 700; letter-spacing: .02em; }
#grafico { position: absolute; }
.telefono { position: absolute; border-radius: 64px; background: #0b0f1a; padding: 14px; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 2px #2b3348 inset; }
.pantalla { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #16171a; }
.pantalla img { position: absolute; left: 0; top: 0; width: 100%; }
.toque { position: absolute; border-radius: 50%; border: 4px solid var(--azul); opacity: 0; }
#cierre img { position: absolute; border-radius: 22%; box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 0 2px rgba(156,189,232,.18); }
.url { position: absolute; color: var(--azul); font-weight: 650; letter-spacing: .01em; }
</style>
</head>
<body>
<div id="stage">
  <div id="flash"></div>

  <!-- 1–2 · el logo animado -->
  <div class="capa" id="logo">
    <svg id="marca" viewBox="230 110 540 540">
      <defs>
        <linearGradient id="gFrente" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9e5f7"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a9c4ec"/></linearGradient>
        <linearGradient id="gAtras" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5285"/><stop offset="1" stop-color="#6d8cc4"/></linearGradient>
        <linearGradient id="gBascula" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfdcef"/></linearGradient>
        <radialGradient id="gHalo"><stop offset="0" stop-color="#9cbde8" stop-opacity=".55"/><stop offset="1" stop-color="#9cbde8" stop-opacity="0"/></radialGradient>
      </defs>
      <circle id="halo" cx="500" cy="350" r="0" fill="url(#gHalo)"/>
      <g id="bascula">
        <path id="bTapa" d="M325 500 H675 Q700 500 708 522 L728 578 Q735 600 712 600 H288 Q265 600 272 578 L292 522 Q300 500 325 500Z" fill="url(#gBascula)"/>
        <path d="M268 598 H732 V612 Q732 628 716 628 H284 Q268 628 268 612Z" fill="#7f97bf"/>
        <path d="M292 522 Q300 504 325 504 H675 Q700 504 708 522" fill="none" stroke="#1d2a48" stroke-width="5" opacity=".25"/>
        <ellipse cx="500" cy="551" rx="78" ry="30" fill="#152040" stroke="#9cbde8" stroke-width="6"/>
        <path id="aguja" d="M500 528 L512 566 H488Z" fill="#ffffff"/>
      </g>
      <path id="atras" fill="url(#gAtras)"/>
      <path id="cinturaI" fill="none" stroke="#eceef1" stroke-width="13" stroke-linecap="round"/>
      <path id="cinturaD" fill="none" stroke="#eceef1" stroke-width="13" stroke-linecap="round"/>
      <path id="frente" fill="url(#gFrente)"/>
      <path id="marcas" stroke="#1d2a48" stroke-width="4" stroke-linecap="round" opacity=".75"/>
      <path id="marcaCentro" stroke="#3d6ab0" stroke-width="7" stroke-linecap="round"/>
      <path id="punta" fill="#7fb0e8"/>
    </svg>
    <div id="lectura"><div class="kg num"><span id="kg">96,4</span><small>kg</small></div><div class="sem" id="sem">Semana 1</div></div>
    <div class="titulo" id="t1"></div>
  </div>

  <!-- 3 · la cinta se vuelve la línea de tendencia -->
  <svg id="grafico" viewBox="0 0 1000 560">
    <g id="rejilla" stroke="#2d3a5c" stroke-width="2" stroke-dasharray="4 10"><path d="M60 120H940M60 260H940M60 400H940"/></g>
    <path id="linea" fill="none" stroke="url(#gLinea)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="gLinea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cbde8"/></linearGradient></defs>
    <g id="puntos"></g>
  </svg>
  <div class="titulo" id="t3"></div>

  <!-- 4 · la app -->
  <div class="telefono" id="tel"><div class="pantalla" id="pant">
    <img id="iFicha" src="capturas/ficha.png" alt="">
    <img id="iGrasa" src="capturas/grasa.png" alt="">
    <img id="iSemana" src="capturas/semana.png" alt="">
    <div class="toque" id="toque"></div>
  </div></div>
  <div class="titulo" id="t4"></div>
  <div class="sub" id="s4"></div>

  <!-- 5 · cierre -->
  <div class="capa" id="cierre">
    <img id="logoFinal" src="logo-canva.png" alt="">
    <div class="titulo" id="t5">Mide tu progreso.</div>
    <div class="url" id="url">phatito.github.io/MedidasCuerpo</div>
  </div>
</div>

<script>
const DURATION = 24;
window.DURATION = DURATION;
const q = new URLSearchParams(location.search);
const F = q.get('f') || 'v';
const W = { v: 1080, h: 1920, og: 1200 }[F], H = { v: 1920, h: 1080, og: 630 }[F];
const $ = (s) => document.querySelector(s);
const stage = $('#stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

// ---------- utilidades de tiempo ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d, e = (x) => x) => e(clamp((t - a) / d));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = (n) => n.toFixed(1).replace('.', ',');
const pos = (el, x, y, w, h) => { el.style.left = x + 'px'; el.style.top = y + 'px'; if (w != null) el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px'; };

// ---------- diseño según formato ----------
const L = F === 'v'
  ? { logo: [90, 330, 900], lect: [0, 1250, 1080, 170], t1: [90, 150, 900, 104], graf: [40, 700, 1000], t3: [90, 220, 900, 104],
      tel: [230, 600, 620], t4: [90, 170, 900, 92], s4: [90, 390, 900, 40], fin: [290, 500, 500], t5: [90, 1130, 900, 112], url: [90, 1300, 900, 44] }
  : F === 'h'
  ? { logo: [1030, 70, 740], lect: [120, 640, 780, 150], t1: [120, 250, 780, 96], graf: [960, 260, 860], t3: [120, 360, 780, 96],
      tel: [1180, 40, 470], t4: [120, 330, 920, 88], s4: [120, 560, 900, 38], fin: [180, 210, 600], t5: [900, 400, 900, 104], url: [905, 570, 900, 42] }
  : { logo: [40, 20, 590], lect: [600, 380, 560, 90], t1: [600, 150, 560, 64], graf: [0, 0, 0], t3: [0, 0, 0, 0],
      tel: [0, 0, 0], t4: [0, 0, 0, 0], s4: [0, 0, 0, 0], fin: [40, 40, 550], t5: [620, 210, 540, 74], url: [624, 330, 540, 30] };

const marca = $('#marca'); pos(marca, L.logo[0], L.logo[1], L.logo[2], L.logo[2]);
const lect = $('#lectura'); pos(lect, L.lect[0], L.lect[1], L.lect[2]);
lect.querySelector('.kg').style.fontSize = L.lect[3] + 'px';
lect.querySelector('.sem').style.fontSize = L.lect[3] * 0.24 + 'px';
for (const [id, k] of [['#t1', 't1'], ['#t3', 't3'], ['#t4', 't4'], ['#t5', 't5']]) { const e = $(id); pos(e, L[k][0], L[k][1], L[k][2]); e.style.fontSize = L[k][3] + 'px'; }
for (const [id, k] of [['#s4', 's4'], ['#url', 'url']]) { const e = $(id); pos(e, L[k][0], L[k][1], L[k][2]); e.style.fontSize = L[k][3] + 'px'; }
if (F === 'h') { $('#t5').style.textAlign = 'left'; } else { $('#t5').style.textAlign = 'center'; $('#url').style.textAlign = 'center'; }
if (F === 'og') { $('#t5').style.textAlign = 'left'; $('#url').style.textAlign = 'left'; }
const graf = $('#grafico'); pos(graf, L.graf[0], L.graf[1], L.graf[2], L.graf[2] * 0.56);
const tel = $('#tel'); const TW = L.tel[2], TH = Math.round(TW * 844 / 390) + 28; pos(tel, L.tel[0], L.tel[1], TW, TH);
const fin = $('#logoFinal'); pos(fin, L.fin[0], L.fin[1], L.fin[2], L.fin[2]);
const pant = $('#pant'); const escala = (TW - 28) / 780;

// ---------- el logo, dibujado a partir de una "tensión" k (0 = suelta, 1 = apretada) ----------
const CY = 350;
function dibujarLogo(k, entrada) {
  const xw = lerp(396, 452, k);                    // borde izquierdo de la cintura
  const izq = `M372 170 C 372 248 ${xw} 286 ${xw} ${CY} C ${xw} 414 330 478 330 560`;
  const der = izq.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g, (m, x, y) => `${1000 - +x} ${y}`);
  $('#cinturaI').setAttribute('d', izq); $('#cinturaD').setAttribute('d', der);
  const largo = 520; for (const id of ['#cinturaI', '#cinturaD']) { const e = $(id); e.style.strokeDasharray = largo; e.style.strokeDashoffset = largo * (1 - entrada.cintura); }
  // la cinta: una banda en perspectiva que se ajusta a la cintura
  const rx = (500 - xw) + lerp(40, 30, k) + 120 * (1 - entrada.cinta), ry = 30 + 14 * (1 - entrada.cinta), h = 44;
  const pt = (t, dy = 0) => [500 + rx * Math.cos(t), CY - 8 + dy + ry * Math.sin(t)];
  const arco = (t0, t1, dy = 0, n = 40) => Array.from({ length: n + 1 }, (_, i) => pt(t0 + (t1 - t0) * i / n, dy));
  const d = (pts) => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
  $('#frente').setAttribute('d', d([...arco(0, Math.PI), ...arco(Math.PI, 0, h)]) + 'Z');
  $('#atras').setAttribute('d', d([...arco(Math.PI, 2 * Math.PI), ...arco(2 * Math.PI, Math.PI, h)]) + 'Z');
  let m = '';
  for (let i = 1; i < 24; i++) { const t = Math.PI * i / 24; const [x, y] = pt(t, h); if (i === 12) continue; m += `M${x.toFixed(1)} ${(y - 4).toFixed(1)}v${i % 3 ? -14 : -24}`; }
  $('#marcas').setAttribute('d', m);
  const [cx, cyy] = pt(Math.PI / 2, h); $('#marcaCentro').setAttribute('d', `M${cx} ${cyy - 4}v-36`);
  const [px, py] = pt(0.16, h * 0.5);
  $('#punta').setAttribute('d', `M${px - 6} ${py - 20} q34 6 40 34 q4 30 -18 52 q-26 4 -34 -18 q8 -30 12 -68Z`);
  ['#frente', '#atras', '#marcas', '#marcaCentro', '#punta'].forEach((s) => ($(s).style.opacity = entrada.cintaVis));
}

// ---------- la tendencia ----------
const PESOS = [96.4, 95.1, 93.8, 92.5];
const puntosLinea = PESOS.map((p, i) => [120 + i * 260, 120 + (96.4 - p) * 70]);
const ptsG = $('#puntos');
PESOS.forEach((p, i) => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = `<circle r="20" fill="#0d1426" stroke="#ffffff" stroke-width="8"/><text y="-44" text-anchor="middle" font-size="44" font-weight="760" font-stretch="72%" fill="#eceef1" font-family="Archivo">${fmt(p)}</text>`;
  g.setAttribute('transform', `translate(${puntosLinea[i][0]} ${puntosLinea[i][1]})`); ptsG.appendChild(g);
});
const lineaD = 'M' + puntosLinea.map(([x, y]) => `${x} ${y}`).join(' L');
$('#linea').setAttribute('d', lineaD);

// ---------- línea de tiempo ----------
const SEMANAS = [3.4, 5.1, 6.8, 8.5];          // momento en que cada semana aprieta
function seek(t) {
  t = clamp(t, 0, DURATION);
  // 1 · entrada: destello, la cintura se dibuja, la cinta entra de golpe y se cierra
  const entrada = { cintura: P(t, 0.25, 1.0, eo), cinta: P(t, 0.9, 0.55, back), cintaVis: P(t, 0.85, 0.12) };
  const flash = Math.max(P(t, 0, 0.2) * (1 - P(t, 0.2, 0.6)), P(t, 1.35, 0.06) * (1 - P(t, 1.41, 0.5)) * 0.8);
  $('#flash').style.opacity = flash;
  // tensión: cada semana aprieta un poco más
  let k = 0;
  SEMANAS.forEach((s, i) => { k += P(t, s, 0.55, back) * (i === 0 ? 0.12 : 0.29); });
  dibujarLogo(Math.min(1.08, k), entrada);
  // pulso del halo en cada apretón
  let pulso = P(t, 1.35, 0.6, eo) * (1 - P(t, 1.35, 0.6));
  SEMANAS.forEach((s) => { pulso = Math.max(pulso, P(t, s, 0.5, eo) * (1 - P(t, s + 0.15, 0.6))); });
  $('#halo').setAttribute('r', 260 + 120 * pulso); $('#halo').style.opacity = pulso;
  // báscula: sube, y la aguja acompaña la baja
  const bIn = P(t, 0.45, 0.8, eo5);
  $('#bascula').setAttribute('transform', `translate(0 ${(1 - bIn) * 260})`); $('#bascula').style.opacity = bIn;
  const semana = SEMANAS.reduce((n, s) => (t >= s ? n + 1 : n), 0);
  let kg = PESOS[0];
  SEMANAS.forEach((s, i) => { if (i > 0) kg = lerp(kg, PESOS[i], P(t, s, 0.7, eo)); });
  $('#aguja').setAttribute('transform', `rotate(${(kg - 96.4) * 14} 500 551)`);
  $('#kg').textContent = fmt(kg);
  $('#sem').textContent = semana ? `Semana ${semana}` : 'Semana 1';
  // capa del logo: aparece, y en la transición sube y se achica
  const sal = P(t, 10.0, 1.1, eio);
  const logo = $('#logo');
  logo.style.opacity = 1 - sal;
  logo.style.transform = `translateY(${-sal * 120}px) scale(${1 - sal * 0.25})`;
  lect.style.opacity = P(t, 2.6, 0.6) * (1 - sal);
  lect.style.transform = `translateY(${(1 - P(t, 2.6, 0.6, eo)) * 40}px)`;
  const t1 = $('#t1');
  t1.textContent = t < 6.2 ? 'Semana a semana,' : 'tu cuerpo cambia.';
  const t1in = t < 6.2 ? P(t, 3.0, 0.6, eo5) : P(t, 6.2, 0.6, eo5);
  t1.style.opacity = t1in * (1 - sal); t1.style.transform = `translateY(${(1 - t1in) * 50}px)`;
  if (F === 'og') { t1.textContent = 'Tu cuerpo, medida a medida.'; t1.style.opacity = 1; t1.style.transform = 'none'; }
  // 3 · la cinta se desenrolla y es la línea de tendencia
  const gIn = P(t, 10.2, 1.4, eio), gOut = P(t, 12.4, 0.6);
  graf.style.opacity = P(t, 10.1, 0.3) * (1 - gOut);
  const lin = $('#linea'); const LL = 900; lin.style.strokeDasharray = LL; lin.style.strokeDashoffset = LL * (1 - gIn);
  [...ptsG.children].forEach((g, i) => { g.style.opacity = P(t, 10.4 + i * 0.32, 0.25); });
  const t3 = $('#t3'); t3.textContent = 'Tu tendencia, no el número de un día.';
  const t3in = P(t, 10.5, 0.6, eo5); t3.style.opacity = t3in * (1 - gOut); t3.style.transform = `translateY(${(1 - t3in) * 50}px)`;
  // 4 · la app real, en el teléfono
  const telIn = P(t, 12.4, 0.9, eo5), telOut = P(t, 19.6, 0.6);
  tel.style.opacity = telIn * (1 - telOut);
  tel.style.transform = `translateY(${(1 - telIn) * 220}px) scale(${0.92 + 0.08 * telIn})`;
  const iF = $('#iFicha'), iG = $('#iGrasa'), iS = $('#iSemana');
  const aGrasa = P(t, 15.1, 0.45), aSemana = P(t, 17.4, 0.45);
  iF.style.opacity = 1 - aGrasa; iG.style.opacity = aGrasa * (1 - aSemana); iS.style.opacity = aSemana;
  iF.style.transform = `translateY(${-P(t, 13.2, 1.5, eio) * 520 * escala}px)`;
  iG.style.transform = `translateY(${-P(t, 15.8, 1.2, eio) * 360 * escala}px)`;
  iS.style.transform = `translateY(${-P(t, 18.0, 1.3, eio) * 420 * escala}px)`;
  const toque = $('#toque'); const tq = P(t, 14.7, 0.5, eo);
  const r = 40 + 70 * tq; toque.style.width = toque.style.height = 2 * r + 'px';
  toque.style.left = (190 * escala - r) + 'px'; toque.style.top = ((860 - 520) * escala - r) + 'px';
  toque.style.opacity = (t > 14.7 && t < 15.3) ? 1 - tq : 0;
  const textos = [[12.6, 'Cada cifra, con su estado.', 'Grasa, músculo, cintura y visceral, de un vistazo.'],
    [15.1, 'Toca una cifra: su historia.', 'El gráfico con la tendencia de cada medida.'],
    [17.4, 'Qué hacer esta semana.', 'Tu gasto real estimado y una acción concreta.']];
  const t4 = $('#t4'), s4 = $('#s4');
  let actual = textos.filter(([a]) => t >= a).pop() || textos[0];
  t4.textContent = actual[1]; s4.textContent = actual[2];
  const t4in = P(t, actual[0], 0.55, eo5);
  t4.style.opacity = t4in * (1 - telOut); s4.style.opacity = P(t, actual[0] + 0.2, 0.5) * (1 - telOut);
  t4.style.transform = `translateY(${(1 - t4in) * 40}px)`;
  // 5 · cierre
  const cIn = P(t, 20.0, 1.0, eo5);
  const cierre = $('#cierre'); cierre.style.opacity = F === 'og' ? 1 : cIn;
  fin.style.transform = F === 'og' ? 'none' : `scale(${0.85 + 0.15 * cIn})`;
  $('#t5').style.opacity = F === 'og' ? 1 : P(t, 20.6, 0.6); $('#url').style.opacity = F === 'og' ? 1 : P(t, 21.1, 0.6);
  if (F === 'og') { logo.style.opacity = 0; }
}
window.seek = seek;

if (F === 'og') { ['#grafico', '#tel', '#t3', '#t4', '#s4'].forEach((s) => ($(s).style.display = 'none')); }
const fija = q.get('t');
if (q.get('render') === '1' || fija != null) seek(fija != null ? +fija : 0);
else { const t0 = performance.now(); const loop = (now) => { seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
</html>
