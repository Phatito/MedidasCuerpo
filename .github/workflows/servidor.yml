name: Publicar servidor de sincronización (Cloudflare)

# Publica el Worker "mesura-sync" cuando cambia servidor/ o a mano.
# Necesita el secreto del repositorio CLOUDFLARE_API_TOKEN (y opcionalmente CLOUDFLARE_ACCOUNT_ID).
on:
  push:
    branches: [main]
    paths: ['servidor/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/servidor
      - name: Avisar si falta la clave
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; el servidor no se publicó."
      - name: Publicar en Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: servidor
        run: npx --yes wrangler@4 deploy
